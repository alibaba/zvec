name: MacOS & Linux Build

on:
  workflow_call:
    inputs:
      platform:
        description: 'Platform identifier'
        required: true
        type: string
      os:
        description: 'GitHub Actions runner OS'
        required: true
        type: string
      compiler:
        description: 'C++ compiler to use (gcc or clang)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Build and test matrix (parallel execution)
  build-and-test:
    name: Build & Test (${{ inputs.platform }})
    runs-on: ${{ inputs.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ inputs.os }}
            platform: ${{ inputs.platform }}
            arch_flag: ""  # Use appropriate architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ inputs.platform }}-${{ inputs.os }}-${{ inputs.compiler || 'gcc' }}
          max-size: 150M

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install Clang
        if: inputs.compiler == 'clang' && runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang libomp-dev
        shell: bash

      - name: Print CPU info
        if: runner.os == 'Linux'
        run: lscpu
        shell: bash

      - name: Set up environment variables
        run: |
          # Set number of processors for parallel builds
          if [[ "${{ matrix.platform }}" == "macos-arm64" ]]; then
            NPROC=$(sysctl -n hw.ncpu 2>/dev/null || echo 2)
          else
            NPROC=$(nproc 2>/dev/null || echo 2)
          fi
          echo "NPROC=$NPROC" >> $GITHUB_ENV
          echo "Using $NPROC parallel jobs for builds"

          # Set compiler when clang is requested
          if [[ "${{ inputs.compiler }}" == "clang" ]]; then
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
          fi

          # Add Python user base bin to PATH for pip-installed CLI tools
          echo "$(python -c 'import site; print(site.USER_BASE)')/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pybind11==3.0 \
            cmake==3.30.0 \
            ninja==1.11.1 \
            pytest \
            pytest-xdist \
            scikit-build-core \
            setuptools_scm
        shell: bash       

      - name: Check CMake subproject integration
        if: matrix.platform == 'linux-x64'
        run: |
          SMOKE_SOURCE="$RUNNER_TEMP/zvec-subproject-smoke"
          SMOKE_BUILD="$RUNNER_TEMP/zvec-subproject-build"

          mkdir -p "$SMOKE_SOURCE" "$SMOKE_BUILD"
          cp "$GITHUB_WORKSPACE/.github/cmake/subproject-integration/CMakeLists.txt" \
            "$SMOKE_SOURCE/CMakeLists.txt"

          cmake -S "$SMOKE_SOURCE" -B "$SMOKE_BUILD" -G Ninja \
            -DZVEC_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TOOLS=OFF \
            -DBUILD_C_BINDINGS=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DENABLE_WERROR=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        shell: bash

      - name: Build from source
        run: |
          cd "$GITHUB_WORKSPACE"

          CMAKE_GENERATOR="Ninja" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          python -m pip install -v . \
            --no-build-isolation \
            --config-settings='cmake.define.BUILD_TOOLS=ON' \
            --config-settings='cmake.define.ENABLE_WERROR=ON' \
            --config-settings='cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache' \
            --config-settings='cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache' \
            ${{ matrix.arch_flag }}
        shell: bash

      - name: Run C++ Tests
        run: |
          cd "$GITHUB_WORKSPACE/build"
          cmake --build . --target unittest --parallel $NPROC
        shell: bash

      - name: Run Python Tests
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest python/tests/
        shell: bash

      - name: Run C++ Examples
        run: |
          cd "$GITHUB_WORKSPACE/examples/c++"
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --parallel $NPROC
          ./db-example
          ./core-example
          ./ailego-example
        shell: bash

      - name: Run C Examples
        run: |
          cd "$GITHUB_WORKSPACE/examples/c"
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . --parallel $NPROC
          ./c_api_basic_example
          ./c_api_collection_schema_example
          ./c_api_doc_example
          ./c_api_field_schema_example
          ./c_api_index_example
          ./c_api_optimized_example
        shell: bash

      # ------------------------------------------------------------------ #
      # DiskAnn io_uring round: GitHub-hosted runners are full VMs on
      # kernel 6.8+, so raw io_uring syscalls are available and win the
      # backend priority (io_uring > libaio > pread).  The main test
      # rounds above therefore already exercised the io_uring path;
      # this step asserts it so a silent probe regression fails CI.
      # ------------------------------------------------------------------ #
      - name: Verify io_uring backend is active
        if: runner.os == 'Linux'
        run: |
          uname -r
          python -c "
          import zvec
          from zvec.typing import IOBackendType
          t = zvec.io_backend_type()
          print('Active I/O backend:', t, '-', zvec.io_backend_description())
          assert t == IOBackendType.IO_URING, f'expected IO_URING, got {t}'
          "
        shell: bash

      # ------------------------------------------------------------------ #
      # DiskAnn libaio round: disable io_uring via sysctl (kernel 6.6+,
      # makes io_uring_setup() fail with -EPERM), install libaio, and
      # re-run tests so the libaio fallback path is genuinely exercised.
      # ------------------------------------------------------------------ #
      - name: Install libaio runtime and disable io_uring
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update -y
          # libaio1t64 on Ubuntu 24.04+ (t64 transition), libaio1 on older
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
          echo "=== libaio status (should be present) ==="
          dpkg -l | grep -i libaio || true
          ldconfig -p | grep libaio || true
          sudo sysctl -w kernel.io_uring_disabled=2
          python -c "
          import zvec
          from zvec.typing import IOBackendType
          t = zvec.io_backend_type()
          print('Active I/O backend:', t)
          assert t == IOBackendType.LIBAIO, f'expected LIBAIO, got {t}'
          "
        shell: bash

      - name: Run DiskAnn C++ Tests (w/ libaio)
        if: matrix.platform == 'linux-x64'
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ctest -R diskann --output-on-failure --parallel $NPROC
        shell: bash

      - name: Run DiskAnn Python Tests (w/ libaio)
        if: matrix.platform == 'linux-x64'
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest python/tests/test_collection_diskann.py -v
        shell: bash

      # ------------------------------------------------------------------ #
      # DiskAnn pread round: with io_uring still disabled, remove libaio
      # so the final synchronous pread() fallback is exercised too.
      # ------------------------------------------------------------------ #
      - name: Remove libaio (force pread fallback)
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get remove -y libaio1t64 libaio1 2>/dev/null || \
            sudo apt-get remove -y libaio1t64 || \
            sudo apt-get remove -y libaio1
          python -c "
          import zvec
          from zvec.typing import IOBackendType
          t = zvec.io_backend_type()
          print('Active I/O backend:', t)
          assert t == IOBackendType.PREAD, f'expected PREAD, got {t}'
          "
        shell: bash

      - name: Run DiskAnn C++ Tests (w/ pread)
        if: matrix.platform == 'linux-x64'
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ctest -R diskann --output-on-failure --parallel $NPROC
        shell: bash

      # Verify installing libaio does not affect existing non-DiskAnn tests.
      - name: Run HNSW Tests (w/ libaio)
        if: matrix.platform == 'linux-x64'
        run: |
          cd "$GITHUB_WORKSPACE/build"
          ctest -R hnsw --output-on-failure --parallel $NPROC
          cd "$GITHUB_WORKSPACE"
          python -m pytest python/tests/test_hnsw_contiguous_memory.py -v
        shell: bash
