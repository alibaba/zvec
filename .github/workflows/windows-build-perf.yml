name: Windows Build Performance

on:
  workflow_call:
    inputs:
      source_ref:
        required: true
        type: string
      jobs:
        default: '4'
        type: string
      order:
        default: ntfs-first
        type: string
      defender_performance_mode:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Source revision to measure (same revision on both volumes)'
        default: 'f1510cd3a97784db4ed5ee097abaa00e5f112436'
        required: true
        type: string
      jobs:
        description: 'Parallel compiler jobs'
        default: '4'
        required: true
        type: string
      order:
        description: 'Paired measurements on the same VM; reverse for a repeat'
        default: ntfs-first
        type: choice
        options: [ntfs-first, devdrive-first]
      defender_performance_mode:
        description: 'ARM-only measurement with Defender real-time protection and performance mode enabled'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  benchmark:
    name: Build perf (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.defender_performance_mode && '["windows-11-vs2026-arm"]' || '["windows-2022","windows-2025-vs2026","windows-11-vs2026-arm"]') }}
    env:
      PERF_JOBS: ${{ inputs.jobs }}
      PERF_ORDER: ${{ inputs.order }}
      PERF_PLATFORM: ${{ matrix.platform }}
      PERF_VS_VERSION: ${{ matrix.platform == 'windows-2022' && '17.0' || '18.0' }}
      PERF_DEFENDER_PERFORMANCE_MODE: ${{ inputs.defender_performance_mode }}
    steps:
      - name: Enable long paths
        shell: powershell
        run: git config --global core.longpaths true
      - name: Checkout benchmark harness
        uses: actions/checkout@v7
        with:
          path: harness
      - name: Checkout source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
          path: source
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.platform == 'windows-11-vs2026-arm' && '3.11' || '3.10' }}
          architecture: ${{ matrix.platform == 'windows-11-vs2026-arm' && 'arm64' || 'x64' }}
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.platform == 'windows-11-vs2026-arm' && 'arm64' || 'x64' }}
      - name: Install fixed build tools
        shell: powershell
        run: |
          python -m pip install pybind11==3.0.0 cmake==3.30.0 ninja==1.11.1 `
            scikit-build-core==1.1.1 setuptools_scm==10.3.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create isolated ReFS / Dev Drive VHDX
        shell: powershell
        run: ./harness/.github/scripts/windows-perf-drive.ps1 -Action Create
      - name: Measure paired builds through pip
        shell: powershell
        run: ./harness/.github/scripts/windows-build-perf.ps1
      - name: Upload timing, commands, and resource samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-perf-${{ matrix.platform }}-${{ inputs.order }}
          path: ${{ runner.temp }}/zvec-build-perf-results
          retention-days: 7
      - name: Detach benchmark VHDX
        if: always()
        shell: powershell
        run: ./harness/.github/scripts/windows-perf-drive.ps1 -Action Detach
