name: Windows Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows build and test matrix
  build-and-test-windows:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            msvc_arch: x64
            python_version: '3.10'
          - platform: windows-2025
            msvc_arch: x64
            python_version: '3.10'
          # Windows ARM64: Python 3.10 has no official ARM64 installer;
          # 3.11 is the first CPython release with a Windows-on-ARM build.
          - platform: windows-11-arm
            msvc_arch: arm64
            python_version: '3.11'

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: Show env info
        run: |
          Get-CimInstance -ClassName Win32_Processor
          where cl
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -prerelease -format json
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cleanup left marker files
        run: |
          git submodule foreach --recursive 'git reset --hard && git clean -ffdx'
        shell: powershell

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          # The explicit statistics steps below are best-effort. Do not let
          # the action's post-run statistics fail an otherwise successful job.
          disable_annotations: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.msvc_arch }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Set up environment variables
        run: |
          $nproc = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          echo "NPROC=$nproc" >> $env:GITHUB_ENV
          echo "Using $nproc parallel jobs for builds"
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip `
            pybind11==3.0 `
            cmake==3.30.0 `
            ninja==1.11.1 `
            pytest `
            pytest-xdist `
            scikit-build-core `
            setuptools_scm
        shell: powershell

      - name: Build from source
        run: |
          cd "$env:GITHUB_WORKSPACE"
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$env:NPROC"
          python -m pip install -v . `
            --no-build-isolation `
            --config-settings='cmake.define.BUILD_TOOLS=ON' `
            --config-settings='cmake.define.ENABLE_WERROR=ON' `
            --config-settings='cmake.define.CMAKE_C_COMPILER_LAUNCHER=sccache' `
            --config-settings='cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=sccache'
        shell: powershell

      - name: Show sccache statistics after pip install
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell

      - name: Check AVX objects for load-time initializers
        if: matrix.msvc_arch == 'x64'
        run: python .github/workflows/scripts/check_simd_initializers.py build
        shell: powershell

      - name: Check loading and search on CPUs without AVX
        if: matrix.platform == 'windows-2022'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "sde.tar.xz"
          $url = "https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-win.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "74E626EDE09B0BAA5011FC9E51B58627EA92C3FC0BAE5FD7DB34B490F335F651"
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $expected) {
            throw "Intel SDE checksum mismatch"
          }
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sde = Join-Path $env:RUNNER_TEMP "sde-external-10.13.1-2026-07-28-win\sde.exe"
          $package = python -c "import importlib.util; print(next(iter(importlib.util.find_spec('zvec').submodule_search_locations)))"
          # Check every bundled native image; CPython and the Windows CRT have
          # their own dispatch and must not obscure violations in zvec (#810).
          $images = Get-ChildItem $package -Recurse -File | Where-Object {
            $_.Extension -eq '.pyd' -or $_.Extension -eq '.dll'
          }
          if (-not $images) { throw "No zvec native images found" }
          $imageArgs = @()
          foreach ($image in $images) {
            $imageArgs += @('-chip_check_image', $image.Name)
          }
          foreach ($cpu in @('-mrm', '-wsm', '-glm', '-snb')) {
            & $sde $cpu @imageArgs -- python -I .github/workflows/scripts/smoke_no_avx.py --dll-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $sde $cpu @imageArgs -- python -I .github/workflows/scripts/smoke_no_avx.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
        shell: powershell

      - name: Run C++ Tests
        run: |
          cd "$env:GITHUB_WORKSPACE\build"
          cmake --build . --target unittest --config Release --parallel $env:NPROC
        shell: powershell

      - name: Show sccache statistics after tests
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell

      - name: Run Python Tests
        run: |
          cd "$env:GITHUB_WORKSPACE"
          python -m pytest python/tests/ --basetemp=./.pytest_tmp
        shell: powershell

      - name: Run C++ Examples
        run: |
          cd "$env:GITHUB_WORKSPACE\examples\c++"
          mkdir build
          cd build
          # These small examples do not need a remote compiler cache. Clear
          # both launchers so a cache outage cannot block their smoke tests.
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER= `
            -DCMAKE_CXX_COMPILER_LAUNCHER=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release --parallel $env:NPROC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copy zvec DLLs next to the example executables so Windows can find them.
          # CMake places DLLs in bin/ (RUNTIME output) and import libs in lib/.
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          foreach ($dllName in @("zvec.dll", "zvec_core.dll", "zvec_ailego.dll")) {
            $found = $false
            foreach ($sub in @("$buildDir\bin", "$buildDir\bin\Release", "$buildDir\lib", "$buildDir\lib\Release")) {
              $dllPath = Join-Path $sub $dllName
              if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination . -Force
                Write-Host "Copied $dllName from $sub"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: $dllName not found, searching recursively..."
              $dll = Get-ChildItem -Path $buildDir -Filter $dllName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dll) {
                Copy-Item $dll.FullName -Destination . -Force
                Write-Host "Copied $dllName from $($dll.DirectoryName)"
              } else {
                Write-Error "$dllName not found anywhere under $buildDir"
              }
            }
          }

          .\db-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\core-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\diskann-core-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ailego-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Show sccache statistics
        if: always()
        continue-on-error: true
        run: sccache --show-stats
        shell: powershell
