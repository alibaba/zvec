name: Windows Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows build and test matrix
  build-and-test-windows:
    name: Build & Test (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-2022
            vs_version: '17.0'
            vs_year: '2022'
            msvc_arch: x64
            python_version: '3.10'
          - platform: windows-2025-vs2026
            vs_version: '18.0'
            vs_year: '2026'
            msvc_arch: x64
            python_version: '3.10'
          # Windows ARM64: Python 3.10 has no official ARM64 installer;
          # 3.11 is the first CPython release with a Windows-on-ARM build.
          - platform: windows-11-vs2026-arm
            vs_version: '18.0'
            vs_year: '2026'
            msvc_arch: arm64
            python_version: '3.11'

    env:
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
      # MSVC supports depend mode through /showIncludes. Avoid a separate
      # preprocessing pass on misses as well as on direct cache hits.
      CCACHE_DEPEND: 'true'
      NINJA_STATUS: '[%f/%t %es] '

    steps:
      - name: Show env info
        run: |
          Get-CimInstance -ClassName Win32_Processor
          & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -prerelease -format json
        shell: powershell

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cleanup left marker files
        run: |
          git submodule foreach --recursive 'git reset --hard && git clean -ffdx'
        shell: powershell

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python_version }}
          architecture: ${{ matrix.msvc_arch }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.msvc_arch }}
          # Runner labels select the VS family; verify it below because this
          # action's explicit version lookup predates VS 2026.

      - name: Verify MSVC toolchain
        id: toolchain
        shell: powershell
        env:
          EXPECTED_VS_VERSION: ${{ matrix.vs_version }}
        run: |
          if ($env:VisualStudioVersion -ne $env:EXPECTED_VS_VERSION) {
            throw "Expected VS $env:EXPECTED_VS_VERSION, got $env:VisualStudioVersion"
          }
          $toolsetPrefix = if ($env:EXPECTED_VS_VERSION -eq '18.0') { '14.5' } else { '14.4' }
          if (-not $env:VCToolsVersion.StartsWith($toolsetPrefix)) {
            throw "Unexpected MSVC toolset: $env:VCToolsVersion (expected $toolsetPrefix*)"
          }
          where.exe cl
          cl /Bv
          # cl without an input reports an error; /Bv above is diagnostic only.
          $global:LASTEXITCODE = 0
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          "cache-key=vs${{ matrix.vs_year }}-${{ matrix.msvc_arch }}-$env:VCToolsVersion-$sdk" >> $env:GITHUB_OUTPUT

      - name: Install ccache
        shell: powershell
        run: ./.github/scripts/setup-windows-ccache.ps1

      # sccache's MSVC hits still run cl's preprocessor for every translation
      # unit. ccache direct mode can validate headers without that work.
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: windows-ccache-v1-${{ steps.toolchain.outputs.cache-key }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            windows-ccache-v1-${{ steps.toolchain.outputs.cache-key }}-

      - name: Reset compiler cache statistics
        run: ccache --zero-stats
        shell: powershell

      - name: Set up environment variables
        run: |
          $nproc = (Get-CimInstance Win32_ComputerSystem).NumberOfLogicalProcessors
          echo "NPROC=$nproc" >> $env:GITHUB_ENV
          echo "Using $nproc parallel jobs for builds"
        shell: powershell

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip `
            pybind11==3.0 `
            cmake==3.30.0 `
            ninja==1.11.1 `
            pytest `
            pytest-xdist `
            scikit-build-core `
            setuptools_scm
        shell: powershell

      - name: Build from source
        run: |
          cd "$env:GITHUB_WORKSPACE"
          $env:CMAKE_GENERATOR = "Ninja"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = "$env:NPROC"
          python -m pip install -v . `
            --no-build-isolation `
            --config-settings='cmake.define.BUILD_TOOLS=ON' `
            --config-settings='cmake.define.ENABLE_WERROR=ON' `
            --config-settings="cmake.define.ZVEC_COLLECTION_TEST_SHARDS=$env:NPROC" `
            --config-settings='cmake.define.CMAKE_C_COMPILER_LAUNCHER=ccache' `
            --config-settings='cmake.define.CMAKE_CXX_COMPILER_LAUNCHER=ccache'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Show compiler cache statistics after pip install
        if: always()
        continue-on-error: true
        run: ccache --show-stats --verbose
        shell: powershell

      - name: Build C++ tests
        run: |
          cd "$env:GITHUB_WORKSPACE\build"
          cmake --build . --target unittest_build --config Release --parallel $env:NPROC
        shell: powershell

      - name: Show compiler cache statistics after test compilation
        if: always()
        continue-on-error: true
        run: ccache --show-stats --verbose
        shell: powershell

      # Save before running tests: a test failure must not discard successful
      # compilation work. Each run gets an immutable cache snapshot.
      - name: Save compiler cache
        uses: actions/cache/save@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Run C++ Tests
        run: ctest --test-dir build --build-config Release --output-on-failure --parallel $env:NPROC
        shell: powershell

      - name: Run Python Tests
        run: |
          cd "$env:GITHUB_WORKSPACE"
          python -m pytest python/tests/ --basetemp=./.pytest_tmp --durations=10
        shell: powershell

      - name: Run C++ Examples
        run: |
          cd "$env:GITHUB_WORKSPACE\examples\c++"
          mkdir build
          cd build
          # These small examples do not need a remote compiler cache. Clear
          # both launchers so a cache outage cannot block their smoke tests.
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER= `
            -DCMAKE_CXX_COMPILER_LAUNCHER=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build . --config Release --parallel $env:NPROC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Copy zvec DLLs next to the example executables so Windows can find them.
          # CMake places DLLs in bin/ (RUNTIME output) and import libs in lib/.
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          foreach ($dllName in @("zvec.dll", "zvec_core.dll", "zvec_ailego.dll")) {
            $found = $false
            foreach ($sub in @("$buildDir\bin", "$buildDir\bin\Release", "$buildDir\lib", "$buildDir\lib\Release")) {
              $dllPath = Join-Path $sub $dllName
              if (Test-Path $dllPath) {
                Copy-Item $dllPath -Destination . -Force
                Write-Host "Copied $dllName from $sub"
                $found = $true
                break
              }
            }
            if (-not $found) {
              Write-Host "WARNING: $dllName not found, searching recursively..."
              $dll = Get-ChildItem -Path $buildDir -Filter $dllName -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($dll) {
                Copy-Item $dll.FullName -Destination . -Force
                Write-Host "Copied $dllName from $($dll.DirectoryName)"
              } else {
                Write-Error "$dllName not found anywhere under $buildDir"
              }
            }
          }

          .\db-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\core-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\ailego-example.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Install and test C/C++ SDK
        shell: powershell
        run: |
          $sdkDir = Join-Path $env:RUNNER_TEMP 'zvec-sdk'
          $smokeDir = Join-Path $env:RUNNER_TEMP 'zvec-sdk-smoke'
          cmake --install build --prefix $sdkDir --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S .github/cmake/sdk-smoke -B $smokeDir -G Ninja `
            -DCMAKE_BUILD_TYPE=Release "-DZVEC_SDK_DIR=$sdkDir"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $smokeDir --parallel $env:NPROC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$sdkDir\bin;$env:PATH"
          ctest --test-dir $smokeDir --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show compiler cache statistics
        if: always()
        continue-on-error: true
        run: ccache --show-stats --verbose
        shell: powershell
