name: Test ARM64 FP16 Fix

on:
  push:
    branches: [fix/arm64-fp16-neon]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build & Test (linux-arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip \
            pybind11==3.0 \
            cmake==3.30.0 \
            ninja==1.11.1 \
            pytest \
            scikit-build-core \
            setuptools_scm

      - name: Build from source
        run: |
          NPROC=$(nproc)
          echo "Building with $NPROC parallel jobs"

          CMAKE_GENERATOR="Unix Makefiles" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          python -m pip install -v . --no-build-isolation

      - name: Verify FP16 NEON compiled
        run: |
          echo "Checking that FP16 NEON objects were compiled..."
          find build/ -name "*fp16*.o" -type f | head -20
          echo "Build completed successfully on ARM64 with FP16 NEON support"

      - name: Run C++ Tests
        run: |
          cd build
          make unittest -j$(nproc)

      - name: Run Python Tests
        run: python -m pytest python/tests/

  build-x64:
    name: Build & Test (linux-x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip \
            pybind11==3.0 \
            cmake==3.30.0 \
            ninja==1.11.1 \
            pytest \
            scikit-build-core \
            setuptools_scm

      - name: Build from source
        run: |
          NPROC=$(nproc)
          CMAKE_GENERATOR="Unix Makefiles" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          python -m pip install -v . --no-build-isolation

      - name: Run C++ Tests
        run: |
          cd build
          make unittest -j$(nproc)

      - name: Run Python Tests
        run: python -m pytest python/tests/

  build-macos:
    name: Build & Test (macos-arm64)
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip \
            pybind11==3.0 \
            cmake==3.30.0 \
            ninja==1.11.1 \
            pytest \
            scikit-build-core \
            setuptools_scm

      - name: Build from source
        run: |
          NPROC=$(sysctl -n hw.ncpu)
          CMAKE_GENERATOR="Unix Makefiles" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          python -m pip install -v . --no-build-isolation

      - name: Run C++ Tests
        run: |
          cd build
          make unittest -j$(sysctl -n hw.ncpu)

      - name: Run Python Tests
        run: python -m pytest python/tests/
