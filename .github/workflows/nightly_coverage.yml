name: Nightly Coverage Report

on:
  schedule:
    # Runs daily at 00:00 CST (China Standard Time) = 16:00 UTC
    - cron: '0 16 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Nightly Coverage Report
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ['3.10']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main # Always use main for nightly
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            .github/constraints-build.txt

      - name: Set up environment variables
        run: |
          python .github/scripts/setup_build_env.py
          
          # Add Python user base bin to PATH for pip-installed CLI tools
          echo "$(python -c 'import site; print(site.USER_BASE)')/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov
          sudo apt-get install -y libaio1t64 || sudo apt-get install -y libaio1
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --constraint .github/constraints-build.txt --upgrade pip \
            pybind11 \
            cmake \
            ninja \
            pytest \
            pytest-cov \
            pytest-xdist \
            scikit-build-core \
            setuptools_scm
        shell: bash

      - name: Build with COVERAGE config
        run: |
          cd "$GITHUB_WORKSPACE"
          
          CMAKE_GENERATOR="Unix Makefiles" \
          python -m pip install -v . \
            --no-build-isolation \
            --config-settings="cmake.build-type=COVERAGE"
        shell: bash

      - name: Run Python Tests with Coverage
        run: |
          cd "$GITHUB_WORKSPACE"
          python -m pytest python/tests/ --cov=zvec --cov-report=xml \
            --deselect=python/tests/test_gil_release.py::TestGILRelease::test_gil_released_during_query
        shell: bash

      - name: Run C++ Tests and Generate Coverage
        run: |
          cd "$GITHUB_WORKSPACE/build"
          cmake --build . --target unittest
          cd "$GITHUB_WORKSPACE"
          # Ensure gcov.sh is executable
          chmod +x scripts/gcov.sh
          bash scripts/gcov.sh -k
        shell: bash

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./proxima-zvec-filtered.lcov.info,./coverage.xml
          flags: python,cpp,nightly
          name: nightly-linux-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
