name: Nightly Coverage Report

on:
  schedule:
    # Runs daily at 00:00 CST (China Standard Time) = 16:00 UTC
    - cron: '0 16 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Nightly Coverage Report
    # Use GitHub-hosted runner (replaces self-hosted `linux_x64` label)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      matrix:
        python-version: ['3.10']
      fail-fast: false

    container:
      image: zvec-registry.cn-hongkong.cr.aliyuncs.com/zvec/zvec:0.0.2
      options: --user root

    env:
      # Cache must live under $GITHUB_WORKSPACE so it is visible to actions/cache
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Activate Conda environment
        run: |
          if [[ "${{ matrix.python-version }}" == "3.10" ]]; then
            ENV_NAME="py310"
          elif [[ "${{ matrix.python-version }}" == "3.11" ]]; then
            ENV_NAME="py311"
          elif [[ "${{ matrix.python-version }}" == "3.12" ]]; then
            ENV_NAME="py312"
          else
            echo "Unsupported Python version"
            exit 1
          fi
          echo "CONDA_ENV_NAME=$ENV_NAME" >> $GITHUB_ENV
          mkdir -p "$PIP_CACHE_DIR"
          source /opt/miniforge3/bin/activate "$ENV_NAME"
          python --version
        shell: bash

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: .cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-nightly-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nightly-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-${{ runner.arch }}-nightly-pip-

      - name: Build with COVERAGE config
        run: |
          source /opt/miniforge3/bin/activate "${{ env.CONDA_ENV_NAME }}"
          cd "$GITHUB_WORKSPACE"

          pip install --upgrade pip pytest pytest-cov

          NPROC=$(nproc 2>/dev/null || echo 2)
          echo "Using $NPROC parallel jobs"

          CMAKE_GENERATOR="Unix Makefiles" \
          CMAKE_BUILD_PARALLEL_LEVEL="$NPROC" \
          pip install -v . \
            --config-settings="cmake.build-type=COVERAGE"
        shell: bash

      - name: Run Python Tests with Coverage
        run: |
          source /opt/miniforge3/bin/activate "${{ env.CONDA_ENV_NAME }}"
          cd "$GITHUB_WORKSPACE"
          python -m pytest python/tests/ --cov=zvec --cov-report=xml
        shell: bash

      - name: Run C++ Tests and Generate Coverage
        run: |
          cd "$GITHUB_WORKSPACE/build"
          make unittest -j"$(nproc)"  # Run all (nightly can afford it)
          cd "$GITHUB_WORKSPACE"
          chmod +x scripts/gcov.sh
          bash scripts/gcov.sh -k
        shell: bash

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ${{ github.workspace }}/proxima-zvec-filtered.lcov.info,${{ github.workspace }}/coverage.xml
          flags: python,cpp,nightly
          name: nightly-linux-py${{ matrix.python-version }}
          token: ${{ secrets.CODECOV_TOKEN }}
