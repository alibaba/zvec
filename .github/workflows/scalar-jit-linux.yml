name: Experimental Linux Scalar JIT Packaging

# Deliberately opt-in until release size, latency and architecture coverage
# have been accepted. Existing wheel/SDK release jobs continue to build OFF.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  manylinux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JIT_IMAGE: zvec-scalar-jit-manylinux:local
      RUNTIME_IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.03.01-1@sha256:d5f19b5957cf25df7ac15465924cafe2358754a187e510af386bf9596598a372
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build baseline LLVM and OpenSSL in manylinux
        run: |
          docker build \
            -f .github/workflows/docker/Dockerfile.scalar_jit_manylinux_2_28 \
            --build-arg ZVEC_TOOLCHAIN_JOBS=2 -t "$JIT_IMAGE" .

      # Build-time OFF remains covered by the existing release jobs; the
      # fresh-process ZVEC_SCALAR_JIT=0 runs below test this ON artifact's
      # runtime fallback. The two switches are intentionally distinct.
      - name: Build and repair JIT ON wheel using the existing cibuildwheel configuration
        env:
          CIBW_MANYLINUX_X86_64_IMAGE: zvec-scalar-jit-manylinux:local
          CIBW_CONFIG_SETTINGS_LINUX: >-
            cmake.define.ZVEC_ENABLE_SCALAR_JIT=ON
            cmake.define.ZVEC_SCALAR_JIT_LLVM_SHARED=OFF
            cmake.define.LLVM_ROOT=/opt/llvm-20
            cmake.define.OPENSSL_ROOT_DIR=/opt/zvec-jit-openssl
            cmake.define.OPENSSL_USE_STATIC_LIBS=ON
            cmake.define.ENABLE_NATIVE=OFF
            cmake.define.CMAKE_EXPORT_COMPILE_COMMANDS=ON
          CIBW_ENVIRONMENT_LINUX: CMAKE_GENERATOR=Ninja CMAKE_BUILD_PARALLEL_LEVEL=2 ZVEC_SCALAR_JIT_PROFILE=1
          CIBW_BEFORE_TEST: >-
            python {project}/.github/scripts/scalar_jit/check_artifact.py
            --build-directory {project}/build --llvm-dis /opt/llvm-20/bin/llvm-dis
            --report /host${{ github.workspace }}/wheel-build-audit.json
          CIBW_TEST_COMMAND: python {project}/.github/scripts/scalar_jit/wheel_smoke.py
          CIBW_TEST_REQUIRES: numpy
        run: |
          python -m pip install cibuildwheel==3.4.0
          python -m cibuildwheel --only cp312-manylinux_x86_64 --output-dir wheelhouse

      - name: Build SDK and test the scalar differential suites
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e ZVEC_JIT_JOBS=2 "$JIT_IMAGE" \
            bash .github/scripts/scalar_jit/package_sdk.sh

      - name: Verify repaired artifacts without the build toolchain
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$RUNTIME_IMAGE" \
            /opt/python/cp312-cp312/bin/python \
            .github/scripts/scalar_jit/check_artifact.py wheelhouse/*.whl jit-sdk \
            --report artifact-audit.json
          docker run --rm -v "$PWD:/work" -w /work "$RUNTIME_IMAGE" bash -c '
            set -euo pipefail
            test ! -d /opt/llvm-20
            if ldconfig -p | grep -E "libLLVM|libgandiva|libclang" >/dev/null; then
              echo "Unexpected LLVM runtime in clean container" >&2
              exit 1
            fi
            /opt/python/cp312-cp312/bin/python -m venv /tmp/jit-wheel
            /tmp/jit-wheel/bin/python -m pip install /work/wheelhouse/*.whl
            /tmp/jit-wheel/bin/python .github/scripts/scalar_jit/wheel_smoke.py \
              --artifact /work/wheelhouse/*.whl --log clean-runtime.log --report clean-runtime.json
            /work/build-jit-sdk-smoke/c_smoke
            /work/build-jit-sdk-smoke/cpp_smoke
            /opt/python/cp312-cp312/bin/python .github/scripts/scalar_jit/sdk_smoke.py \
              --binary build-jit-sdk-smoke/scalar_jit_smoke \
              --collection build-jit-sdk-smoke/jit-collection \
              --library-directory jit-sdk/lib --output-directory sdk-jit-clean-logs
          '

      - name: Test identical artifacts on native, AVX2, and SSE4.2 CPUs
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
          python -m venv wheel-venv
          wheels=(wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          wheel-venv/bin/python -m pip install "${wheels[0]}" pytest
          mkdir -p wheel-jit-cpu-logs
          failed=0
          for cpu in native Haswell-v4 Nehalem; do
            prefix=()
            feature=()
            if [[ "$cpu" != native ]]; then
              prefix=(qemu-x86_64 -cpu "$cpu")
              if [[ "$cpu" == Haswell-v4 ]]; then
                feature=(--expect-avx2-only)
              else
                feature=(--expect-sse42-only)
              fi
            fi
            for mode in on off; do
              enabled=1
              [[ "$mode" == on ]] || enabled=0
              ZVEC_SCALAR_JIT=$enabled ZVEC_SCALAR_JIT_PROFILE=1 \
                timeout 15m "${prefix[@]}" wheel-venv/bin/python \
                .github/scripts/scalar_jit/wheel_smoke.py --expect-jit "$mode" \
                --artifact "${wheels[0]}" "${feature[@]}" \
                --log "wheel-jit-cpu-logs/$cpu-$mode.log" \
                --report "wheel-jit-cpu-logs/$cpu-$mode.json" || failed=1
            done
          done
          # Children must run natively; they must not escape QEMU's CPUID mask.
          wheel-venv/bin/python -m pytest python/tests/test_scalar_jit_runtime.py \
            .github/scripts/scalar_jit/test_artifact.py -o addopts= -v \
            --junitxml=wheel-jit-cpu-logs/lifecycle.xml || failed=1
          python .github/scripts/scalar_jit/sdk_smoke.py \
            --binary build-jit-sdk-smoke/scalar_jit_smoke \
            --collection build-jit-sdk-smoke/jit-collection \
            --library-directory jit-sdk/lib --output-directory sdk-jit-cpu-logs \
            --qemu "$(command -v qemu-x86_64)" || failed=1
          exit "$failed"

      - name: Upload experimental packages and compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scalar-jit-manylinux-x64
          path: |
            wheelhouse/*.whl
            zvec-sdk-linux-amd64-scalar-jit.tar.gz
            clean-runtime.log
            clean-runtime.json
            artifact-audit.json
            wheel-build-audit.json
            sdk-build-audit.json
            build-jit-sdk/scalar-tests.xml
            wheel-jit-cpu-logs/
            sdk-jit-*-logs/
          if-no-files-found: error
          retention-days: 7
