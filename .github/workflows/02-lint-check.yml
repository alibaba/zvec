name: Lint

on:
  workflow_call:

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip \
            ruff==v0.14.4 \
            clang-format==18.1.8
        shell: bash

      - name: Run Ruff Linter
        run: python -m ruff check .
        shell: bash

      - name: Run Ruff Formatter Check
        run: python -m ruff format --check .
        shell: bash

      - name: Check Public C++ Header Hygiene
        run: python scripts/check_public_headers.py --verbose --compile-check
        shell: bash

      # libzvec exports exactly what this list allows, and the list is derived
      # from the published headers, so a public header edit that forgets a
      # regeneration would ship a library that cannot satisfy its own headers.
      # Clang is required (the AST dump is clang-only); ubuntu runners ship it,
      # but install it rather than silently skip if a future image drops it.
      - name: Check libzvec Export Whitelist
        run: |
          if ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
          python scripts/generate_export_whitelist.py --require-clang --verbose
        shell: bash

      - name: Run clang-format Check
        run: |
          CPP_FILES=$(find . -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" -o -name "*.cc" -o -name "*.cxx" \) \
            ! -path "./build/*" \
            ! -path "./tests/*" \
            ! -path "./scripts/*" \
            ! -path "./python/*" \
            ! -path "./thirdparty/*" \
            ! -path "./.git/*")

          if [ -z "$CPP_FILES" ]; then
            echo "No C++ files found to check."
            exit 0
          fi

          clang-format --dry-run --Werror $CPP_FILES
        shell: bash
