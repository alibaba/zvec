name: Android Cross Build & Test

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      api:
        description: 'Android API level'
        required: false
        default: '34'
        type: string

permissions:
  contents: read

env:
  NDK_VERSION: '26.1.10909125'

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # x86_64 runs the emulator suite; arm64-v8a provides compile/link
        # coverage for the ABI used by physical Android devices.
        abi: [x86_64, arm64-v8a]
        api: ${{ github.event.inputs.api && fromJSON(format('["{0}"]', github.event.inputs.api)) || fromJSON('["34"]') }}
    steps:
      # ── Environment setup ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build git ca-certificates python3 \
            build-essential make unzip curl

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-${{ matrix.abi }}
          max-size: 300M

      - name: Setup Java 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: sudo chmod 666 /dev/kvm || true

      - name: Install NDK and Android platform
        shell: bash
        run: |
          sdkmanager --install \
            "ndk;$NDK_VERSION" \
            "platform-tools" \
            "platforms;android-${{ matrix.api }}"

      - name: Install emulator and x86_64 system image
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          sdkmanager --install "emulator"

          # Install x86_64 system image (try variants in order of availability)
          sdkmanager --install "system-images;android-${{ matrix.api }};google_apis;x86_64" 2>/dev/null || \
          sdkmanager --install "system-images;android-${{ matrix.api }};google_apis_playstore;x86_64" 2>/dev/null || \
          sdkmanager --install "system-images;android-${{ matrix.api }};default;x86_64"

      # ── Step 1: cross-compile zvec + tests for Android ─────────────────────────
      - name: 'Step 1: Cross-compile zvec and tests'
        shell: bash
        env:
          BUILD_DIR: build_android_${{ matrix.abi }}
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"

          # Reset thirdparty so the cross toolchain can patch cleanly
          git submodule foreach --recursive 'git stash --include-untracked' 2>/dev/null || true

          # Force reconfigure to pick up any cmake changes
          rm -f "$BUILD_DIR/CMakeCache.txt"

          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DANDROID_NDK="$ANDROID_NDK_HOME" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=${{ matrix.api }} \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_ZVEC_SHARED=OFF \
            -DBUILD_ZVEC_AILEGO_SHARED=OFF \
            -DBUILD_ZVEC_CORE_SHARED=OFF \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_CPP_EXAMPLES=ON \
            -DENABLE_NATIVE=OFF \
            -DAUTO_DETECT_ARCH=OFF \
            -DENABLE_WERROR=ON \
            -DCMAKE_INSTALL_PREFIX="$BUILD_DIR/install" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          if [ "${{ matrix.abi }}" = "arm64-v8a" ]; then
            echo "Building focused DiskAnn tests and public C++ examples for arm64-v8a..."
            cmake --build "$BUILD_DIR" \
              --target diskann_mobile_compat_test diskann_mobile_collection_test zvec_cpp_examples \
              --parallel
            exit 0
          fi

          echo "Building all x86_64 targets..."
          cmake --build "$BUILD_DIR" --parallel
          cmake --build "$BUILD_DIR" \
            --target diskann_mobile_compat_test diskann_mobile_collection_test \
            --parallel

          # Discover test targets from ctest metadata
          echo "Discovering test targets..."
          TEST_NAMES=()
          while IFS= read -r line; do
            name=$(echo "$line" | sed -n 's/.*Test[[:space:]]*#[0-9]*:[[:space:]]*//p')
            [ -n "$name" ] && TEST_NAMES+=("$name")
          done < <(cd "$BUILD_DIR" && ctest --show-only 2>/dev/null || true)

          # Fallback: scan ninja targets for *_test
          if [ ${#TEST_NAMES[@]} -eq 0 ]; then
            echo "ctest unavailable, scanning ninja targets..."
            while IFS= read -r line; do
              name=$(echo "$line" | sed -n 's/^\([a-zA-Z0-9_]*_test\): .*/\1/p')
              [ -n "$name" ] && TEST_NAMES+=("$name")
            done < <(ninja -C "$BUILD_DIR" -t targets all 2>/dev/null || true)
          fi

          if [ ${#TEST_NAMES[@]} -eq 0 ]; then
            echo "ERROR: No Android test targets were discovered"
            exit 1
          fi

          # All test cases in this legacy target are disabled with #if 0.
          # Exclude it instead of treating a zero-test binary as a passing suite.
          FILTERED_TEST_NAMES=()
          for name in "${TEST_NAMES[@]}"; do
            if [ "$name" = "cosine_distance_matrix_int8_test" ]; then
              echo "Skipping $name: it contains no enabled GTest cases"
              continue
            fi
            FILTERED_TEST_NAMES+=("$name")
          done
          TEST_NAMES=("${FILTERED_TEST_NAMES[@]}")

          if [ ${#TEST_NAMES[@]} -eq 0 ]; then
            echo "ERROR: No non-empty Android test targets were discovered"
            exit 1
          fi

          for required_test in diskann_mobile_compat_test diskann_mobile_collection_test; do
            found=0
            for name in "${TEST_NAMES[@]}"; do
              if [ "$name" = "$required_test" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "ERROR: Required Android DiskAnn test target was not discovered: $required_test"
              exit 1
            fi
          done

          echo "Building ${#TEST_NAMES[@]} test executables..."
          ninja -C "$BUILD_DIR" -j$(nproc) "${TEST_NAMES[@]}"

          for required_test in diskann_mobile_compat_test diskann_mobile_collection_test; do
            required_binary="$BUILD_DIR/bin/$required_test"
            if [ ! -x "$required_binary" ]; then
              echo "ERROR: Missing required Android DiskAnn test binary: $required_binary"
              exit 1
            fi
          done

      # ── Step 3: start emulator ─────────────────────────────────────────
      - name: 'Step 3: Start Android emulator'
        if: matrix.abi == 'x86_64'
        shell: bash
        run: |
          AVD_NAME="zvec_test_avd"
          AVD_DIR="$HOME/.android/avd/${AVD_NAME}.avd"
          AVD_INI="$HOME/.android/avd/${AVD_NAME}.ini"

          # Find installed system image (same priority as build_android.sh)
          SYS_IMG=""
          for variant in google_apis google_apis_playstore default; do
            candidate="$ANDROID_HOME/system-images/android-${{ matrix.api }}/$variant/x86_64"
            if [ -d "$candidate" ]; then
              SYS_IMG="$candidate"
              break
            fi
          done
          if [ -z "$SYS_IMG" ]; then
            SYS_IMG=$(find "$ANDROID_HOME/system-images" -type d -name "x86_64" 2>/dev/null | head -1)
          fi
          if [ -z "$SYS_IMG" ]; then
            echo "ERROR: No x86_64 system image found"
            exit 1
          fi
          echo "System image: $SYS_IMG"

          # Extract tag from path (e.g. .../google_apis/x86_64 -> google_apis)
          SYS_TAG=$(basename "$(dirname "$SYS_IMG")")

          # Create AVD via INI files (faster and more reliable than avdmanager)
          mkdir -p "$AVD_DIR"

          cat > "$AVD_INI" << EOAVD
          avd.ini.encoding=UTF-8
          path=${AVD_DIR}
          path.rel=avd/${AVD_NAME}.avd
          target=android-${{ matrix.api }}
          EOAVD

          cat > "$AVD_DIR/config.ini" << EOCFG
          AvdId=${AVD_NAME}
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=${AVD_NAME}
          avd.ini.encoding=UTF-8
          disk.dataPartition.size=8G
          hw.accelerator.isConfigured=true
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.lcd.density=420
          hw.lcd.height=1920
          hw.lcd.width=1080
          hw.ramSize=4096
          image.sysdir.1=${SYS_IMG}/
          tag.display=${SYS_TAG}
          tag.id=${SYS_TAG}
          EOCFG

          echo "Created AVD: $AVD_NAME"

          # Launch emulator in background
          $ANDROID_HOME/emulator/emulator -avd "$AVD_NAME" \
            -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect \
            -netdelay none -netspeed full \
            -memory 4096 \
            -no-snapshot \
            -wipe-data &
          echo "EMULATOR_PID=$!" >> "$GITHUB_ENV"

          # Wait for device to be reachable
          adb wait-for-device

          # Poll for boot completion with timeout
          echo "Waiting for boot to complete..."
          TIMEOUT=300
          ELAPSED=0
          while true; do
            BOOTED=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r\n ' || true)
            if [ "$BOOTED" = "1" ]; then
              echo "Emulator ready (took ${ELAPSED}s)"
              break
            fi
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "ERROR: Emulator failed to boot within ${TIMEOUT}s"
              exit 1
            fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done

          echo "Device ABI: $(adb shell getprop ro.product.cpu.abi | tr -d '\r')"
          echo "ABI list  : $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      # ── Step 4: run unit tests on emulator ─────────────────────────────
      - name: 'Step 4: Run unit tests on emulator'
        if: matrix.abi == 'x86_64'
        shell: bash
        env:
          BUILD_DIR: build_android_${{ matrix.abi }}
        run: |
          DEVICE_TEST_DIR="/data/local/tmp/zvec_tests"
          DEVICE_LIB_DIR="$DEVICE_TEST_DIR/lib"
          adb shell "mkdir -p $DEVICE_TEST_DIR $DEVICE_LIB_DIR"

          # Push shared libraries
          echo "Pushing shared libraries..."
          SO_COUNT=0
          while IFS= read -r so_file; do
            adb push "$so_file" "$DEVICE_LIB_DIR/$(basename "$so_file")" > /dev/null 2>&1
            SO_COUNT=$((SO_COUNT + 1))
          done < <(find "$BUILD_DIR/lib" -name "*.so" -type f 2>/dev/null)
          echo "Pushed $SO_COUNT shared libraries"

          # Push helper binaries (needed by crash_recovery tests which fork+exec them)
          echo "Pushing helper binaries..."
          for helper_name in data_generator collection_optimizer; do
            helper_path=$(find "$BUILD_DIR" -name "$helper_name" -type f -executable ! -name "*_test" 2>/dev/null | head -1)
            if [ -n "$helper_path" ]; then
              adb push "$helper_path" "$DEVICE_TEST_DIR/$helper_name" > /dev/null 2>&1
              adb shell "chmod 755 $DEVICE_TEST_DIR/$helper_name"
              echo "  Pushed $helper_name"
            fi
          done

          # Discover test targets from ctest metadata
          TEST_NAMES=()
          while IFS= read -r line; do
            name=$(echo "$line" | sed -n 's/.*Test[[:space:]]*#[0-9]*:[[:space:]]*//p')
            [ -n "$name" ] && TEST_NAMES+=("$name")
          done < <(cd "$BUILD_DIR" && ctest --show-only 2>/dev/null || true)

          if [ ${#TEST_NAMES[@]} -eq 0 ]; then
            while IFS= read -r line; do
              name=$(echo "$line" | sed -n 's/^\([a-zA-Z0-9_]*_test\): .*/\1/p')
              [ -n "$name" ] && TEST_NAMES+=("$name")
            done < <(ninja -C "$BUILD_DIR" -t targets all 2>/dev/null || true)
          fi

          if [ ${#TEST_NAMES[@]} -eq 0 ]; then
            echo "ERROR: No Android test targets were discovered"
            exit 1
          fi

          FILTERED_TEST_NAMES=()
          for name in "${TEST_NAMES[@]}"; do
            if [ "$name" = "cosine_distance_matrix_int8_test" ]; then
              continue
            fi
            FILTERED_TEST_NAMES+=("$name")
          done
          TEST_NAMES=("${FILTERED_TEST_NAMES[@]}")

          for required_test in diskann_mobile_compat_test diskann_mobile_collection_test; do
            found=0
            for name in "${TEST_NAMES[@]}"; do
              if [ "$name" = "$required_test" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -ne 1 ]; then
              echo "ERROR: Required Android DiskAnn test target was not discovered: $required_test"
              exit 1
            fi
          done

          # Collect test binaries
          TEST_BINS=()
          for name in "${TEST_NAMES[@]}"; do
            bin_path=$(find "$BUILD_DIR" -name "$name" -type f -executable 2>/dev/null | head -1)
            if [ -n "$bin_path" ]; then
              TEST_BINS+=("$bin_path")
            else
              echo "ERROR: binary not found for discovered test target '$name'"
              exit 1
            fi
          done

          for required_test in diskann_mobile_compat_test diskann_mobile_collection_test; do
            required_binary="$BUILD_DIR/bin/$required_test"
            if [ ! -x "$required_binary" ]; then
              echo "ERROR: Missing required Android DiskAnn test binary: $required_binary"
              exit 1
            fi
          done

          TOTAL=${#TEST_BINS[@]}
          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No Android test binaries were collected"
            exit 1
          fi

          PASSED=0
          FAILED=0
          FAILED_NAMES=()
          IDX=0
          DISKANN_COMPAT_PASSED=0
          DISKANN_COLLECTION_PASSED=0

          echo "Running $TOTAL unit tests on emulator..."

          for test_bin in "${TEST_BINS[@]}"; do
            IDX=$((IDX + 1))
            test_name=$(basename "$test_bin")
            device_path="$DEVICE_TEST_DIR/$test_name"
            # Give each test its own working directory to avoid name collisions
            WORK_DIR="$DEVICE_TEST_DIR/workdir_${test_name}"

            echo ""
            echo "────────────────────────────────────────"
            echo "  [$IDX/$TOTAL] $test_name"
            echo "────────────────────────────────────────"

            # Create isolated working directory
            adb shell "mkdir -p $WORK_DIR" 2>/dev/null

            # Copy helper binaries into working directory so crash_recovery tests
            # (which fork+exec data_generator / collection_optimizer) can find them
            adb shell "for h in $DEVICE_TEST_DIR/data_generator $DEVICE_TEST_DIR/collection_optimizer; do [ -f \$h ] && cp \$h $WORK_DIR/; done" 2>/dev/null || true

            # Push test binary
            adb push "$test_bin" "$device_path" > /dev/null 2>&1
            adb shell "chmod 755 $device_path" 2>/dev/null

            # Run test from its own working directory with a hard timeout.
            # GTEST_COLOR=no keeps the required summary machine-readable.
            set +e
            OUTPUT=$(timeout --signal=TERM --kill-after=10s 600s \
              adb shell "cd $WORK_DIR && GTEST_COLOR=no LD_LIBRARY_PATH=$DEVICE_LIB_DIR $device_path 2>&1; echo EXIT_CODE=\$?" 2>&1)
            ADB_EXIT=$?
            set -e

            # Extract exit code from the output
            EXIT_CODE=$(printf '%s\n' "$OUTPUT" | grep -o 'EXIT_CODE=[0-9]*' | tail -1 | cut -d= -f2 || true)

            # Print test output (without the EXIT_CODE marker)
            echo "$OUTPUT" | grep -v 'EXIT_CODE=' | sed 's/^/  /' || true

            EXPECTED_COUNT=""
            case "$test_name" in
              diskann_mobile_compat_test)
                EXPECTED_COUNT=7
                ;;
              diskann_mobile_collection_test)
                EXPECTED_COUNT=4
                ;;
            esac

            TEST_PASSED=1
            if [ "$ADB_EXIT" -eq 124 ] || [ "$ADB_EXIT" -eq 137 ]; then
              echo "  >>> FAILED (timed out after 600 seconds)"
              adb shell "pkill -f $device_path" 2>/dev/null || true
              TEST_PASSED=0
            elif [ "$ADB_EXIT" -ne 0 ]; then
              echo "  >>> FAILED (adb exit=$ADB_EXIT)"
              TEST_PASSED=0
            elif [ -z "$EXIT_CODE" ]; then
              echo "  >>> FAILED (missing device exit code)"
              TEST_PASSED=0
            elif [ "$EXIT_CODE" -ne 0 ]; then
              echo "  >>> FAILED (exit=$EXIT_CODE)"
              TEST_PASSED=0
            elif grep -Eq '^\[  FAILED  \]' <<< "$OUTPUT"; then
              echo "  >>> FAILED (GTest reported failures)"
              TEST_PASSED=0
            elif [ -n "$EXPECTED_COUNT" ] && \
                 ! grep -Eq "^\\[  PASSED  \\][[:space:]]+${EXPECTED_COUNT} tests?\\.[[:space:]]*$" <<< "$OUTPUT"; then
              echo "  >>> FAILED (required ${EXPECTED_COUNT}/${EXPECTED_COUNT} summary not found)"
              TEST_PASSED=0
            elif [ -n "$EXPECTED_COUNT" ] && \
                 ! grep -Eq "^\\[==========\\][[:space:]]+${EXPECTED_COUNT} tests?[[:space:]]+from[[:space:]]+[1-9][0-9]* test (suites?|cases?)[[:space:]]+ran\\." <<< "$OUTPUT"; then
              echo "  >>> FAILED (expected exactly ${EXPECTED_COUNT} executed tests)"
              TEST_PASSED=0
            elif [ -n "$EXPECTED_COUNT" ]; then
              : # The required DiskAnn suite ran exactly N/N tests successfully.
            elif grep -Eq '^\[==========\][[:space:]]+[1-9][0-9]* tests?[[:space:]]+from[[:space:]]+[1-9][0-9]* test (suites?|cases?)[[:space:]]+ran\.' <<< "$OUTPUT"; then
              : # A non-empty GTest suite completed without failures; skips are valid.
            elif [ "$test_name" = "c_api_test" ] && \
                 grep -Eq '^Passed: [1-9][0-9]*[[:space:]]*$' <<< "$OUTPUT" && \
                 grep -Eq '^Failed: 0[[:space:]]*$' <<< "$OUTPUT"; then
              : # c_api_test uses a custom test framework.
            else
              echo "  >>> FAILED (no recognisable non-empty passing test summary)"
              TEST_PASSED=0
            fi

            if [ "$TEST_PASSED" -eq 1 ]; then
              echo "  >>> PASSED"
              PASSED=$((PASSED + 1))
              if [ "$test_name" = "diskann_mobile_compat_test" ]; then
                DISKANN_COMPAT_PASSED=1
              elif [ "$test_name" = "diskann_mobile_collection_test" ]; then
                DISKANN_COLLECTION_PASSED=1
              fi
            else
              FAILED=$((FAILED + 1))
              FAILED_NAMES+=("$test_name")
            fi

            # Clean up binary and working directory to reclaim disk space
            adb shell "rm -rf $device_path $WORK_DIR" 2>/dev/null || true
          done

          echo ""
          echo "============================================================"
          echo " Test Summary"
          echo "============================================================"
          echo "  Total  : $TOTAL"
          echo "  Passed : $PASSED"
          echo "  Failed : $FAILED"
          if [ $FAILED -gt 0 ]; then
            echo ""
            echo "  Failed tests:"
            for name in "${FAILED_NAMES[@]}"; do
              echo "    - $name"
            done
          fi
          echo "============================================================"

          if [ "$DISKANN_COMPAT_PASSED" -ne 1 ] || [ "$DISKANN_COLLECTION_PASSED" -ne 1 ]; then
            echo "Required DiskAnn tests did not both complete successfully"
            exit 1
          fi
          if [ "$PASSED" -ne "$TOTAL" ]; then
            echo "Only ${PASSED}/${TOTAL} Android tests completed successfully"
            exit 1
          fi
          if [ $FAILED -gt 0 ]; then
            exit 1
          fi
          echo "All tests passed!"

      # ── Step 5: build and run examples ─────────────────────────────────
      - name: 'Step 5: Build and run examples'
        if: matrix.abi == 'x86_64'
        shell: bash
        env:
          BUILD_DIR: build_android_${{ matrix.abi }}
        run: |
          cmake --build "$BUILD_DIR" --target zvec_cpp_examples --parallel
          READELF="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          for example in ailego-example core-example external-vector-example db-example; do
            example_path="$BUILD_DIR/bin/$example"
            if [ ! -f "$example_path" ]; then
              echo "Missing example binary: $example_path"
              exit 1
            fi

            echo "=== Verifying $example is self-contained ==="
            dynamic_section=$("$READELF" --dynamic "$example_path")
            echo "$dynamic_section" | grep NEEDED || true
            if echo "$dynamic_section" | grep -Eq 'libzvec[^]]*\.so|libc\+\+_shared\.so'; then
              echo "$example unexpectedly depends on a C++ shared library"
              exit 1
            fi

            echo "=== Running $example ==="
            adb push "$example_path" "/data/local/tmp/$example" > /dev/null 2>&1
            adb shell "chmod 755 /data/local/tmp/$example && cd /data/local/tmp && ./$example"
            adb shell "rm -f /data/local/tmp/$example"
          done

      - name: 'Step 3: Verify arm64-v8a artifacts'
        if: matrix.abi == 'arm64-v8a'
        shell: bash
        env:
          BUILD_DIR: build_android_${{ matrix.abi }}
        run: |
          READELF="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          for binary in \
            diskann_mobile_compat_test \
            diskann_mobile_collection_test \
            ailego-example \
            core-example \
            external-vector-example \
            db-example; do
            binary_path="$BUILD_DIR/bin/$binary"
            if [ ! -f "$binary_path" ]; then
              echo "Missing arm64-v8a binary: $binary_path"
              exit 1
            fi
            if ! "$READELF" --file-header "$binary_path" | grep -q 'Machine:.*AArch64'; then
              echo "$binary_path is not an AArch64 binary"
              exit 1
            fi
          done

          for example in ailego-example core-example external-vector-example db-example; do
            example_path="$BUILD_DIR/bin/$example"
            dynamic_section=$("$READELF" --dynamic "$example_path")
            if echo "$dynamic_section" | grep -Eq 'libzvec[^]]*\.so|libc\+\+_shared\.so'; then
              echo "$example unexpectedly depends on a C++ shared library"
              exit 1
            fi
          done

      # ── Cleanup ────────────────────────────────────────────────────────
      - name: Stop emulator
        if: matrix.abi == 'x86_64' && always()
        shell: bash
        run: |
          adb emu kill 2>/dev/null || true
          sleep 2
          if [ -n "$EMULATOR_PID" ]; then
            kill "$EMULATOR_PID" 2>/dev/null || true
          fi
